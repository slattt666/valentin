<!doctype html>
<html lang="sk">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Will you be my Valentine?</title>
	<style>
		:root{--card-size: min(85vmin,720px);--accent:#ff6b9a}
		html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}
		body{
			background: url('assets/loveback.jpg') center/cover no-repeat fixed;
			display:flex;align-items:center;justify-content:center;padding:20px;
		}
		.card{
			width:var(--card-size);height:var(--card-size);background:rgba(255,255,255,0.85);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,0.25);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:28px;
		}
		#dachshund{width:100%;height:auto;pointer-events:none;border-radius:8px;display:block}
		.gif-frame{width:min(60%,360px);background:linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,250,250,0.6));padding:8px;border-radius:14px;border:1px solid rgba(255,107,154,0.12);box-shadow:0 12px 30px rgba(255,107,154,0.06);display:flex;align-items:center;justify-content:center;margin-top:12px}
		h1{font-size:clamp(30px,6vmin,56px);margin:10px 20px 0;text-align:center;z-index:2;line-height:1.02;letter-spacing:0.6px;font-weight:800;background:linear-gradient(90deg,#ff4d7a,#ff9ccf);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 6px 18px rgba(255,107,154,0.08)}
		.message-area{min-height:48px;margin-top:10px;color:#222;font-weight:700;text-align:center}
		.buttons{display:flex;gap:20px;margin-bottom:22px;z-index:30}
		button{padding:14px 28px;border-radius:999px;border:0;font-size:18px;cursor:pointer;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,0.18);transition:transform 180ms cubic-bezier(.2,.9,.2,1),box-shadow 180ms ease}
		#yes{background:linear-gradient(90deg,#ff2d78,#ff88b6);color:white;transform-origin:center;animation:neon 1800ms infinite alternate;}
		#no{background:#111;color:#fff;text-transform:uppercase;letter-spacing:1px}
		#no:active,#yes:active{transform:translateY(2px)}
		.messages-list{max-height:140px;overflow:auto;margin-top:6px;font-size:15px;color:#444}
		/* dramatic visuals */
		@keyframes neon{from{box-shadow:0 6px 30px rgba(255,45,120,0.18),0 0 30px rgba(255,45,120,0.08)}to{box-shadow:0 18px 60px rgba(255,120,180,0.28),0 0 60px rgba(255,120,180,0.14)}}
		@keyframes floaty{0%{transform:translateY(0)}50%{transform:translateY(-6px)}100%{transform:translateY(0)}}
		.card{animation:floaty 6s ease-in-out infinite;backdrop-filter:blur(4px)}
		.gif-frame{box-shadow:0 18px 60px rgba(255,100,150,0.12),inset 0 1px 0 rgba(255,255,255,0.6)}
		.heart{position:absolute;font-size:24px;will-change:transform,opacity;pointer-events:none;text-shadow:0 6px 18px rgba(0,0,0,0.18)}
		/* make hearts go across the whole viewport */
		.hearts-wrap{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:100000}
		.asset-gif{position:fixed;width:120px;opacity:0;transform:translateY(20px) scale(0.8);transition:opacity 600ms ease,transform 700ms cubic-bezier(.2,.8,.2,1);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.28);pointer-events:none}
		/* try to tint/bring color into the Pibble gif if it's monochrome and add glow */
		.asset-gif.pibble{filter:sepia(0.45) saturate(2.4) hue-rotate(260deg) brightness(1.02);box-shadow:0 22px 80px rgba(170,80,180,0.18);border:3px solid rgba(255,255,255,0.12)}

		/* big success message (floating banner above card) */
		.big-message{position:absolute;left:50%;top:calc(50% - var(--card-size)/2 - 72px);transform:translateX(-50%) scale(0.95);display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:200000;font-weight:900;font-size:clamp(18px,4.8vmin,48px);line-height:1;letter-spacing:0.6px;text-align:center;padding:12px 26px;border-radius:14px;background:linear-gradient(90deg,rgba(255,255,255,0.96),rgba(255,250,250,0.9));box-shadow:0 20px 50px rgba(255,80,140,0.12);color:#2b002b;opacity:0;transform-origin:center;transition:opacity 420ms cubic-bezier(.2,.9,.2,1),transform 420ms cubic-bezier(.2,.9,.2,1)}
		.big-message.closeable{cursor:pointer}
	</style>
</head>
<body>
	<div class="card" id="card">
		<h1>Will you be my valentine?</h1>
		<div class="gif-frame" aria-hidden="true">
			<img id="dachshund" src="assets/Flower%20Dachshund%20GIF%20by%20beangoods.gif" alt="dachshund" />
		</div>
		<div class="message-area">
			<div class="messages-list" id="messages"></div>
		</div>

		<div class="buttons" id="buttons">
			<button id="yes">YES</button>
			<button id="no">NO</button>
			<button id="reset" style="display:none;background:#fff;color:#222;border-radius:10px;padding:8px 12px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,0.08)">RESET</button>
		</div>

		<div class="hearts-wrap" id="hearts"></div>
	</div>

	<!-- big success message (hidden until YES clicked) - placed outside .card so it's visible -->
	<div id="big-message" class="big-message" aria-hidden="true"></div>

	<script>
		// asset filenames discovered in the workspace
		const assetNames = [
			'Flower Dachshund GIF by beangoods.gif',
			'dachshund2.gif',
			'Pibble GIF.gif',
			'pibblegif2.gif',
			'sealgif.webp',
			'loveback.jpg'
		];
		const persistentDachshundName = 'Flower Dachshund GIF by beangoods.gif';

		const yes = document.getElementById('yes');
		const no = document.getElementById('no');
		const messages = document.getElementById('messages');
		const heartsWrap = document.getElementById('hearts');
		const card = document.getElementById('card');

		const noMessages = ['Si si istá?', 'Ty nie si asi malý seal?', 'Hm......'];
		let msgIndex = 0;
		let yesScale = 1;

		// runtime flags
		let heartsRunning = false;
		let heartsInterval = null;
		let assetsShown = false;

		function appendMessage(text){
			const el = document.createElement('div');
			el.textContent = text;el.style.padding='6px 8px';el.style.borderBottom='1px dashed rgba(0,0,0,0.05)';
			messages.prepend(el);
		}

		function rectsIntersect(a,b){
			const ar = a.getBoundingClientRect();
			const br = b.getBoundingClientRect();
			return !(ar.right < br.left || ar.left > br.right || ar.bottom < br.top || ar.top > br.bottom);
		}

		no.addEventListener('click', ()=>{
			// append cycling message
			appendMessage(noMessages[msgIndex % noMessages.length]);
			msgIndex++;

			// grow YES
			yesScale *= 1.18;
			yes.style.transform = `scale(${yesScale})`;

			// small pulse for yes
			yes.style.boxShadow = '0 18px 40px rgba(255,107,154,0.24)';
			setTimeout(()=>yes.style.boxShadow='0 6px 18px rgba(0,0,0,0.12)',250);

			// check if YES now overlaps NO
			requestAnimationFrame(()=>{
				if(rectsIntersect(yes,no)){
					// YES covered NO — hide NO
					no.style.visibility = 'hidden';
					appendMessage('Hmm... myslím, že už to zvládnem :)');
				}
			});
		});

		yes.addEventListener('click', ()=>{
			// prevent repeat clicks
			if(yes.disabled) return;
			yes.disabled = true;
			yes.style.pointerEvents = 'none';
			yes.style.opacity = '0.85';

			appendMessage('Áno! ❤️');
			startHearts();
			revealAssetGifs();
			showBigMessage();
		});

		function startHearts(){
			if(heartsRunning) return;
			heartsRunning = true;
			// immediate big burst
			spawnBurst(32);
			// then keep spawning bursts periodically for a sustained effect
			heartsInterval = setInterval(()=>spawnBurst(18 + Math.floor(Math.random()*12)), 700);
			// keep YES disabled while effect runs
			yes.disabled = true; yes.style.pointerEvents='none'; yes.style.opacity='0.85';
		}

		function spawnBurst(count){
			const colors = ['#ff6b9a','#ff9ccf','#ffd166','#ff5c8a','#a28cff','#ffb3c6','#ff7b3a'];
			for(let i=0;i<count;i++){
				const el = document.createElement('div');
				el.className='heart';
				const startX = Math.random() * window.innerWidth;
				el.style.left = startX + 'px';
				el.style.top = (-40 - Math.random()*200) + 'px';
				const size = (10 + Math.random()*56);
				el.style.fontSize = size + 'px';
				const color = colors[Math.floor(Math.random()*colors.length)];
				el.style.color = color;
				el.style.opacity = 0.98;
				el.textContent = '❤';
				el.style.textShadow = `0 6px 18px ${hexToRgba(color,0.28)}`;
				const dur = 2800 + Math.random()*5200;
				el.style.transition = `transform ${dur}ms cubic-bezier(.2,.9,.2,1), opacity ${dur}ms linear`;
				heartsWrap.appendChild(el);
				const driftX = (Math.random()*900-450);
				const rotate = (Math.random()*360-180);
				requestAnimationFrame(()=>{
					el.style.transform = `translateY(${window.innerHeight + 400}px) translateX(${driftX}px) rotate(${rotate}deg)`;
					el.style.opacity = '0';
				});
				setTimeout(()=>el.remove(), dur+500);
			}
		}

			function hexToRgba(hex, a){
				const h = hex.replace('#','');
				const r = parseInt(h.substring(0,2),16);
				const g = parseInt(h.substring(2,4),16);
				const b = parseInt(h.substring(4,6),16);
				return `rgba(${r},${g},${b},${a})`;
			}

		function revealAssetGifs(){
			// show other gifs from assets around the card
				if(assetsShown) return;
				assetsShown = true;
				const names = assetNames.filter(n=>n !== persistentDachshundName && !n.toLowerCase().includes('loveback'));
				const rect = card.getBoundingClientRect();
				const centerX = rect.left + rect.width/2;
				const centerY = rect.top + rect.height/2;
				const baseRadius = Math.max(rect.width, rect.height)/2 + 40;
				// preset positions around the card (avoid top-center where banner appears)
				const presets = [
					{dx: 1, dy: -0.6}, // right-top
					{dx: -1, dy: -0.6}, // left-top
					{dx: 1, dy: 0.6}, // right-bottom
					{dx: -1, dy: 0.6}, // left-bottom
					{dx: 0, dy: 1.3}, // bottom-center
					{dx: 1.6, dy: 0}, // far right-center
					{dx: -1.6, dy: 0} // far left-center
				];

				names.forEach((name, i)=>{
					const img = document.createElement('img');
					img.src = 'assets/' + encodeURIComponent(name);
					const isPibble = name.toLowerCase().includes('pibble');
					img.className = 'asset-gif' + (isPibble ? ' pibble' : '');
					const size = isPibble ? Math.min(420, 240 + Math.random()*160) : Math.min(160, 80 + Math.random()*120);
					img.style.width = size + 'px';
					// choose preset position to avoid overlaps
					const p = presets[i % presets.length];
					const radius = baseRadius + (Math.floor(i / presets.length) * 40);
					const left = Math.round(centerX + p.dx * radius - size/2);
					const top = Math.round(centerY + p.dy * radius - size/2);
					img.style.left = left + 'px';
					img.style.top = top + 'px';
					img.style.zIndex = isPibble ? 15000 : 11000;
					document.body.appendChild(img);
					// reveal with slight delay and pop
					img.style.transform = 'translateY(20px) scale(0.6) rotate(-8deg)';
					setTimeout(()=>{img.style.opacity=1;img.style.transform='translateY(0) scale(1) rotate(0deg)';}, 120 + i*140);
				});
		}

		let bigMsgTimeout = null;

		function showBigMessage(){
			const el = document.getElementById('big-message');
			el.textContent = 'Ja som to vedel — malý seal pibble, ľúbim ťa!';
			el.setAttribute('aria-hidden','false');
			el.classList.add('closeable');
			el.style.opacity = '1';
			el.style.transform = 'translateY(0) scale(1)';
			// show reset button
			document.getElementById('reset').style.display = 'inline-block';
			// auto-hide after 6s
			if(bigMsgTimeout) clearTimeout(bigMsgTimeout);
			bigMsgTimeout = setTimeout(()=>{
				hideBigMessage();
			}, 6000);
		}

		function hideBigMessage(){
			const el = document.getElementById('big-message');
			el.style.opacity = '0';
			el.style.transform = 'translateY(10px) scale(0.95)';
			el.setAttribute('aria-hidden','true');
			el.classList.remove('closeable');
			if(bigMsgTimeout){clearTimeout(bigMsgTimeout);bigMsgTimeout=null}
		}

		// allow clicking the banner to dismiss it (non-blocking)
		document.getElementById('big-message').addEventListener('click', ()=>{
			hideBigMessage();
		});

		// Reset button: stop hearts, remove assets, re-enable YES
		document.getElementById('reset').addEventListener('click', ()=>{
			resetAll();
		});

		function resetAll(){
			// stop spawning hearts
			if(heartsInterval){clearInterval(heartsInterval);heartsInterval=null}
			heartsRunning = false;
			// remove existing heart elements
			while(heartsWrap.firstChild) heartsWrap.removeChild(heartsWrap.firstChild);
			// remove asset gifs
			document.querySelectorAll('.asset-gif').forEach(n=>n.remove());
			assetsShown = false;
			// re-enable YES
			yes.disabled = false; yes.style.pointerEvents='auto'; yes.style.opacity='1';
			yesScale = 1; yes.style.transform = 'scale(1)';
			// hide big message and hide reset
			hideBigMessage();
			document.getElementById('reset').style.display = 'none';
		}

		// small friendly hint for touch devices: make no area larger
		no.style.padding = '14px 28px';
		yes.style.padding = '14px 28px';

		// initial message
		appendMessage('Klikni NO, ak chceš flirtovať... a sleduj, čo sa stane 😉');
	</script>
</body>
</html>
